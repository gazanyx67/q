
name: Build ZENIX CLIENT

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          echo "Files in repository:"
          ls -la
          echo "Searching for Gradle files..."
          find . -maxdepth 5 \
            \( -name build.gradle -o \
               -name build.gradle.kts -o \
               -name settings.gradle -o \
               -name settings.gradle.kts -o \
               -name gradlew \) -print

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Build JAR
        shell: bash
        run: |
          set -e

          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew clean build --no-daemon
          elif [ -f ./build.gradle ] || [ -f ./build.gradle.kts ]; then
            gradle clean build --no-daemon
          else
            echo "::error::Gradle project not found. Upload the Minecraft client source code and Gradle configuration."
            exit 1
          fi

      - name: Prepare JAR artifact
        run: |
          mkdir -p output
          find . -type f -path "*/build/libs/*.jar" \
            ! -name "*-sources.jar" \
            ! -name "*-javadoc.jar" \
            -exec cp {} output/ \;

          if ! find output -type f -name "*.jar" | grep -q .; then
            echo "::error::Build finished without producing a JAR."
            exit 1
          fi

          ls -lh output/

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: ZENIX-CLIENT-JAR
          path: output/*.jar
          if-no-files-found: error
          
