
name: Build ZENIX CLIENT

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
          fi

      - name: Build JAR with Gradle
        run: |
          set -e
          if [ -f ./gradlew ]; then
            ./gradlew clean build --no-daemon
          elif [ -f ./build.gradle ] || [ -f ./build.gradle.kts ]; then
            gradle clean build --no-daemon
          else
            echo "ERROR: Gradle project not found."
            echo "Upload the project source files and Gradle configuration."
            exit 1
          fi

      - name: Find built JAR
        run: |
          mkdir -p output
          find . -type f -path "*/build/libs/*.jar" \
            ! -name "*-sources.jar" \
            ! -name "*-javadoc.jar" \
            -exec cp {} output/ \;
          if [ -z "$(find output -type f -name '*.jar' -print -quit)" ]; then
            echo "ERROR: No JAR was generated."
            exit 1
          fi
          ls -lh output/

      - name: Upload JAR artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ZENIX-CLIENT-JAR
          path: output/*.jar
          if-no-files-found: error
          
