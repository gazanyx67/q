
name: ZENIX BUILD TEST

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Create test file
        run: |
          mkdir -p output
          echo "ZENIX BUILD TEST SUCCESS" > output/zenix-test.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zenix-build-test
          path: output/zenix-test.txt
          
